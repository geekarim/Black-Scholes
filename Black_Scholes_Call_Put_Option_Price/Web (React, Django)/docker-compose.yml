services:
  backend:
    build:
      context: ./black_scholes_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./black_scholes_app:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
    depends_on:
      - frontend

  frontend:
    build:
      context: ./black_scholes_frontend
    volumes:
      - ./black_scholes_frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm start
